listen_addresses = '*'

max_connections = 200

# ---------------------------------------
# 1. 核心并行开关 (针对 64 核优化)
# ---------------------------------------
max_worker_processes = 64            # 总进程数对齐核心数
max_parallel_workers = 64            # 允许所有核参与并行
max_parallel_maintenance_workers = 32 # 单个索引构建允许用到 32 核

# ---------------------------------------
# 2. 内存优化 (针对 256GB 优化)
# ---------------------------------------
shared_buffers = 64GB                # 维持原样，这已经很棒了
maintenance_work_mem = 64GB           # 既然你一次只跑 2 个进程，给到 64G 没问题
effective_cache_size = 180GB
work_mem = 1GB                       # 从 512MB 翻倍到 1GB，让排序更丝滑

# ---------------------------------------
# 3. 写入优化 (保持高性能)
# ---------------------------------------
max_wal_size = 64GB                  # 从 32G 翻倍，减少构建索引时的检查点频率
checkpoint_timeout = 1h              # 从 30min 延长到 1h
